V.agenda=el=>{el.innerHTML='<div id=cl class=card></div><h3>Compromissos</h3><div id=evw></div>';cal($('#cl'));mod('ev',$('#evw'))};
V.mesas=el=>{const T_=L('mesas'),G=L('guests'),un=G.filter(g=>!g.mesa&&g.rsvp!='Não comparecerá'),d=i=>`data-m=mesas data-i=${i}`;
el.innerHTML=`<div class=bar><span class=mut>${un.length} convidado(s) sem mesa</span><span class=sp></span><button class=pri data-a=add data-m=mesas>+ Nova mesa</button></div><div class=cards2>${T_.map(t=>{const gs=G.filter(g=>g.mesa==t.id&&g.rsvp!='Não comparecerá'),u=sum(gs,seats),cp=+t.cap||0;return `<div class="card tb ${cp&&u>cp?'over':''}"><div class=bar style="margin:0"><h3 style="margin:0">${esc(t.nome)}</h3><span class=sp></span><button class=ic data-a=edit ${d(t.id)}>✎</button><button class=ic data-a=dup ${d(t.id)}>⧉</button><button class=ic data-a=del ${d(t.id)}>✕</button></div>${pb('Lugares ocupados',cp?u/cp*100:0,u+' / '+(cp||'?'))}${cp&&u>cp?`<div class=al>Capacidade excedida em ${u-cp} lugar(es)!</div>`:cp?`<small>${cp-u} lugar(es) disponível(is)</small>`:''}<ul>${gs.map(g=>`<li><span>${gn(g)}${g.acomp>0?` (+${g.acomp})`:''}</span><button class=ic title=Remover data-a=rm data-i=${g.id}>×</button></li>`).join('')}</ul><select data-asg=${t.id}><option value="">+ Adicionar convidado…</option>${un.map(g=>`<option value=${g.id}>${gn(g)}</option>`).join('')}</select>${t.prefs?`<p class=mut>📝 ${esc(t.prefs)}</p>`:''}</div>`}).join('')||'<p class=mut>Crie a primeira mesa. Os convidados vêm da lista de convidados.</p>'}</div><div class=card style="margin-top:14px"><h3>Conflitos e preferências gerais</h3><textarea id=cf rows=3 style="width:100%">${esc(C().conf||'')}</textarea></div>`;$('#cf').onchange=e=>{C().conf=e.target.value;save()}};
V.wd=el=>{const pp=L('pag').filter(r=>!r.pago);el.innerHTML=`<div id=a></div><h3>Checklists do dia</h3><div id=b></div><div class=cards2 style="margin-top:14px"><div class=card><h3>Contatos rápidos</h3>${L('cont').map(c=>`<div>${esc(c.nome)} <small>${esc(c.papel)}</small> ${c.tel?`<a href="tel:${esc(c.tel)}">${esc(c.tel)}</a>`:''}</div>`).join('')||'<p class=mut>Cadastre em Contatos.</p>'}</div><div class=card><h3>Pagamentos pendentes</h3>${pp.map(r=>`<div>${esc(r.forn)} ${esc(r.parc||'')} — <b>${R(r.valor)}</b> <small>${fd(r.venc)}</small></div>`).join('')||'<p class=mut>Nenhum pagamento pendente.</p>'}</div></div>`;mod('wd',$('#a'));mod('wdck',$('#b'))};
V.rel=el=>{const x=X(),cat={},p=L('pag'),pp=a=>sum(a,r=>r.valor);L('orc').forEach(r=>cat[r.cat]=(cat[r.cat]||0)+(+r.contr||+r.est||0));const cnt=(k,o,a)=>o.map(s=>[s,a.filter(r=>r[k]==s).length]);
el.innerHTML=`<div class=cards2>${bars('Evolução do orçamento',[['Orçado',x.orc,'var(--gd)'],['Estimado',x.est],['Contratado',x.contr,'var(--bld)'],['Pago',x.pago,'#5d7a56']],R)}${bars('Gastos por categoria',Object.entries(cat).sort((a,b)=>b[1]-a[1]),R)}${bars('Pagamentos',[['Realizados',pp(p.filter(r=>r.pago)),'#5d7a56'],['Futuros',pp(p.filter(r=>!r.pago&&(!r.venc||dd(r.venc)>=0))),'var(--gd)'],['Atrasados',pp(p.filter(r=>!r.pago&&r.venc&&dd(r.venc)<0)),'var(--bld)']],R)}${bars('Status dos convidados (pessoas)',['Confirmado','Aguardando','Não enviado','Não comparecerá'].map(s=>[s,sum(L('guests').filter(g=>g.rsvp==s),seats)]))}${bars('Progresso das tarefas',cnt('status',M.tasks.fl.find(f=>f.k=='status').o,L('tasks')))}${bars('Fornecedores por status',cnt('status',M.forn.fl.find(f=>f.k=='status').o,L('forn')))}</div>`};
V.dados=el=>{el.innerHTML=`<div class=card><h3>Seus dados</h3><p>Tudo fica salvo neste navegador (localStorage). Faça backups periódicos.</p><div class=bar><button class=pri data-a=bk>Exportar / importar backup (JSON)</button><button data-a=clr>Limpar todos os dados</button></div></div>`};
const NAV=[['Visão geral',[['dash','Dashboard'],['agenda','Agenda'],['pend','Pendências'],['tasks','Checklist'],['rel','Relatórios']]],['Planejamento',[['guests','Convidados'],['mesas','Mesas'],['padr','Padrinhos'],['forn','Fornecedores'],['orc','Orçamento'],['pag','Pagamentos']]],['Nosso casamento',[['cer','Cerimônia'],['rec','Recepção'],['deco','Decoração'],['mus','Música'],['buf','Buffet e bebidas'],['foto','Foto e vídeo']]],['Noiva e noivo',[['noiva','Look da noiva'],['noivo','Look do noivo'],['beleza','Beleza']]],['Detalhes',[['conv','Convites e papelaria'],['pres','Presentes'],['doc','Documentos'],['log','Logística'],['cont','Contatos'],['planb','Plano B']]],['Final',[['wd','Wedding Day'],['lua','Lua de mel'],['pos','Pós-casamento'],['notas','Notas e ideias'],['dados','Backup e dados']]]],NAME={};
$('#nav').innerHTML=`<div class=lg><span>✿ ❦ ✿</span><b>Wedding Planner</b></div>`+NAV.map(([g,a])=>`<h6>${g}</h6>`+a.map(([i,n])=>{NAME[i]=n;return `<a href="#${i}" data-n=${i}>${n}</a>`}).join('')).join('');
function render(){PG=location.hash.slice(1);if(!NAME[PG])PG='dash';document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.n==PG));$('#main').innerHTML=`<button class=mb data-a=menu>☰ Menu</button><div class=ph><h2>${NAME[PG]}</h2></div><div id=pg></div>`;(V[PG]||(e=>mod(PG,e)))($('#pg'));$('#nav').classList.remove('open')}
function seed(id){const m=M[id],cur=L(id),has=i=>cur.some(r=>r.ex&&r.item==i);let n=0;const st=m.fl.find(f=>f.k=='status').o[0];
if(m.sdt){const dt=C().data;SDT.forEach(([item,cat,d,pri])=>{if(has(item))return;cur.push({id:uid(),item,cat,pri,status:st,data:dt?new Date(new Date(dt+'T12:00')-d*864e5).toISOString().slice(0,10):'',ex:1});n++})}
else m.sd.split('#').forEach(g=>{const[cat,its]=g.split('=');its.split(';').forEach(item=>{if(has(item))return;cur.push({id:uid(),item,cat,status:st,ex:1});n++})});done();toast(n+' sugestão(ões) adicionada(s). Edite ou apague à vontade.')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const{a,m,i,k,d}=b.dataset,r=m&&i?L(m).find(x=>x.id==i):null;
switch(a){case'menu':$('#nav').classList.toggle('open');break;case'close':md.close();break;case'yes':md.close();YES&&YES();break;
case'add':open(m);break;case'edit':open(m,i);break;
case'del':ask(`Excluir “${r[M[m].fl[0].k]}”? Esta ação não pode ser desfeita.`,()=>{D[m]=L(m).filter(x=>x.id!=i);if(m=='mesas')L('guests').forEach(g=>g.mesa==i&&(g.mesa=''));done()});break;
case'dup':{const f=M[m].fl[0].k,c={...r,id:uid(),[f]:r[f]+' (cópia)'};delete c.ex;L(m).splice(L(m).indexOf(r)+1,0,c);done()}break;
case'ok':if(M[m].fl.some(f=>f.k=='pago')){r.pago=!r.pago;r.dpag=r.pago?today():''}else r.status=r.status=='Concluído'?M[m].fl.find(f=>f.k=='status').o[0]:'Concluído';done();break;
case'mv':{const l=L(m),x=l.indexOf(r),y=x+ +d;if(y>=0&&y<l.length){[l[x],l[y]]=[l[y],l[x]];done()}}break;
case'cyc':{const o=M[m].fl.find(f=>f.k==k).o;r[k]=o[(o.indexOf(r[k])+1)%o.length];done()}break;
case'sort':{const s=ST_[m];s.d=s.s==k?-s.d:1;s.s=k;tbl(m)}break;
case'seed':seed(m);break;case'unseed':ask('Apagar todas as sugestões carregadas automaticamente? Itens que você criou não são afetados.',()=>{D[m]=L(m).filter(x=>!x.ex);done()});break;
case'rm':L('guests').find(x=>x.id==i).mesa='';done();break;
case'cm':CAL.m+=+d;if(CAL.m<0){CAL.m=11;CAL.y--}if(CAL.m>11){CAL.m=0;CAL.y++}cal($('#cl'));break;
case'cfgf':form(M.cfg,C(),v=>{Object.assign(C(),v);done()},0);break;
case'xorc':{if(L('orc').some(o=>o.forn==r.emp))return toast('Já existe item no orçamento para este fornecedor.');const c=r.status=='Contratado';L('orc').push({id:uid(),item:r.emp,cat:r.cat,forn:r.emp,est:r.valor,contr:c?r.valor:'',pago:r.pago||'',status:c?'Contratado':'Cotando',venc:r.prox||''});done();toast('Enviado ao orçamento.')}break;
case'parc':{const n=Math.max(1,+r.parc||1),base=+r.contr||+r.est||0;if(!base)return toast('Informe o valor contratado ou estimado.');ask(`Gerar ${n} parcela(s) de ${R(base/n)} para “${r.item}”? Parcelas não pagas já geradas serão substituídas.`,()=>{D.pag=L('pag').filter(p=>!(p.oid==i&&!p.pago));const s=new Date((r.venc||today())+'T12:00');for(let j=0;j<n;j++){const x=new Date(s);x.setMonth(s.getMonth()+j);L('pag').push({id:uid(),forn:r.forn||r.item,oid:i,parc:`${j+1}/${n}`,valor:Math.round(base/n*100)/100,venc:x.toISOString().slice(0,10),pago:false,forma:r.forma||'PIX'})}done();toast('Parcelas criadas em Pagamentos.')})}break;
case'cmp':{const g={};L('forn').filter(f=>+f.valor&&f.status!='Descartado').forEach(f=>(g[f.cat]=g[f.cat]||[]).push(f));md.innerHTML=`<h3>Comparar propostas</h3>${Object.entries(g).map(([c,a])=>`<h4>${esc(c)}</h4><table>${a.sort((x,y)=>x.valor-y.valor).map((f,j)=>`<tr><td>${esc(f.emp)}</td><td>${R(f.valor)}</td><td><span class="b ${bc(f.status)}">${f.status}</span></td><td>${j?'+'+R(f.valor-a[0].valor):'🏷 menor valor'}</td></tr>`).join('')}</table>`).join('')||'<p class=mut>Cadastre fornecedores com valor para comparar.</p>'}<div class=fa><button data-a=close>Fechar</button></div>`;md.showModal()}break;
case'bk':md.innerHTML=`<h3>Backup dos dados</h3><p class=mut>Copie ou baixe o JSON para guardar. Para restaurar, cole um backup abaixo (ou escolha o arquivo) e clique em Importar.</p><textarea id=bj rows=8 style="width:100%">${esc(JSON.stringify(D))}</textarea><div class=fa><button data-a=bkdl>Baixar .json</button><button data-a=bkcp>Copiar</button><label class=btn>Escolher arquivo<input type=file id=bf accept=.json hidden></label><button class=pri data-a=bkim>Importar</button><button data-a=close>Fechar</button></div>`;md.showModal();$('#bf').onchange=ev=>{const f=ev.target.files[0];if(f){const fr=new FileReader();fr.onload=()=>{$('#bj').value=fr.result;toast('Arquivo lido. Clique em Importar.')};fr.readAsText(f)}};break;
case'bkdl':{const x=document.createElement('a');x.href=URL.createObjectURL(new Blob([$('#bj').value],{type:'application/json'}));x.download='backup-casamento.json';x.click();toast('Se o download não iniciar, use “Copiar”.')}break;
case'bkcp':$('#bj').select();try{navigator.clipboard.writeText($('#bj').value)}catch(x){document.execCommand('copy')}toast('Copiado.');break;
case'bkim':try{const o=JSON.parse($('#bj').value);if(!o||typeof o!='object'||!o.cfg)throw 0;ask('Substituir TODOS os dados atuais por este backup?',()=>{D=o;done()})}catch(x){toast('JSON inválido.')}break;
case'clr':ask('Apagar TODOS os dados do planner? Esta ação não pode ser desfeita.',()=>{D={cfg:{}};done()});break}});
document.addEventListener('input',e=>{const q=e.target.dataset.q;if(q){ST_[q].q=e.target.value;tbl(q)}});
document.addEventListener('change',e=>{const t=e.target,ds=t.dataset;if(ds.fm){ST_[ds.fm].f[ds.fk]=t.value;tbl(ds.fm)}if(ds.asg&&t.value){const g=L('guests').find(x=>x.id==t.value),tb=L('mesas').find(x=>x.id==ds.asg);g.mesa=ds.asg;const u=sum(L('guests').filter(x=>x.mesa==tb.id&&x.rsvp!='Não comparecerá'),seats);save();render();if(+tb.cap&&u>+tb.cap)toast('⚠️ '+tb.nome+' ultrapassou a capacidade.')}});
md.addEventListener('close',()=>{});onhashchange=render;setInterval(()=>{if(PG=='dash'&&!md.open)render()},30000);render();
</script></body></html>
